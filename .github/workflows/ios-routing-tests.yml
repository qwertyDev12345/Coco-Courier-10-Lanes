name: iOS routing and consent regression tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'EasyLaunch-Patch/**'
      - '.github/workflows/ios-routing-tests.yml'
      - 'Gemfile*'
  pull_request:
    paths:
      - 'EasyLaunch-Patch/**'
      - '.github/workflows/ios-routing-tests.yml'
      - 'Gemfile*'

permissions:
  contents: read

concurrency:
  group: routing-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1.269.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test production controllers without Unity export or TestFlight
        run: bundle exec bash EasyLaunch-Patch/Tests/run_ios_tests.sh
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-routing-and-consent-results
          path: build/routing-tests/*.xcresult
          if-no-files-found: warn
